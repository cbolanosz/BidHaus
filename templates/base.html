{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BidHaus{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="masthead">
        <div class="shell masthead-inner">
            <a class="wordmark" href="{% url 'auctions:catalogue' %}">
                <img src="{% static 'img/logo-horizontal.svg' %}" alt="BidHaus" width="128" height="32">
            </a>
            <nav>
                <a href="{% url 'auctions:catalogue' %}">Subastas</a>
                <a class="button" href="{% url 'auctions:auction_create' %}">Publicar subasta</a>
            </nav>
        </div>
    </header>

    <main class="shell content">
        {% if messages %}
            <ul class="banners">
                {% for message in messages %}
                    <li class="banner banner-{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="shell">
            <p>BidHaus — proyecto académico de la Universidad EAFIT. Los pagos son simulados.</p>
        </div>
    </footer>
</body>
</html>
